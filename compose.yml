services:
  bot:
    build: .
    image: discord-market-bot:local
    restart: unless-stopped
    # DISCORD_TOKEN (required), DEV_GUILD_ID and RUST_LOG (optional). See .env.example.
    env_file: .env
    environment:
      DATABASE_PATH: /data/market.db
    volumes:
      - data:/data
    # Run exactly one instance: two would both handle every interaction and share one SQLite file.
    deploy:
      replicas: 1
    # The bot idles at a few tens of MB. Caps keep a bug from affecting the other services on the box.
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
